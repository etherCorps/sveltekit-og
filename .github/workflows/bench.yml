name: Bench

# Compares every PR into v5, dev or main against v4.4.0. Both sides run on the same
# runner and the same toolchain: scripts/bench-baseline.sh swaps v4.4.0's src/lib
# into a copy of the PR checkout, so only library code differs. (The committed
# baselines were recorded on a laptop and aren't comparable to CI hardware.)
# Non-blocking until the v5 bench gate (#8).
on:
  pull_request:
    branches: [v5, dev, main]

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      PKG: packages/sveltekit-og
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile

      - name: Baseline (v4.4.0 lib, PR toolchain)
        run: bash $PKG/scripts/bench-baseline.sh v4.4.0

      - name: PR head
        working-directory: ${{ env.PKG }}
        run: |
          pnpm package
          pnpm bench:compare
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          node benchmarks/cold.mjs | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
