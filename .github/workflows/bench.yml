name: Bench

# Compares every PR into v5, dev or main against v4.4.0. Both sides run on the same runner:
# the committed baselines were recorded on a laptop and aren't comparable to CI
# hardware. The PR's bench files are copied onto the 4.4.0 checkout, which works
# because they only touch the public API. Non-blocking until the v5 bench gate (#8).
on:
  pull_request:
    branches: [v5, dev, main]

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      PKG: packages/sveltekit-og
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Baseline (v4.4.0)
        run: |
          git worktree add ../base v4.4.0
          cp $PKG/src/image-response.bench.ts ../base/$PKG/src/
          cp $PKG/benchmarks/cold.mjs ../base/$PKG/benchmarks/
          cd ../base
          pnpm install --frozen-lockfile
          cd $PKG
          pnpm package
          pnpm bench:save
          node benchmarks/cold.mjs --save

      - name: PR head
        run: |
          pnpm install --frozen-lockfile
          cp ../base/$PKG/benchmarks/baseline.json ../base/$PKG/benchmarks/cold-baseline.json $PKG/benchmarks/
          cd $PKG
          pnpm package
          pnpm bench:compare
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          node benchmarks/cold.mjs | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
